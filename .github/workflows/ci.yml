name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Warms the shared bun download cache once, so the parallel jobs below start
  # with it instead of racing to download the same packages.
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Warm dependencies
        run: bun install --frozen-lockfile

  bats:
    name: bats
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install GNU parallel
        run: sudo apt-get update -qq && sudo apt-get install -y -qq parallel

      - name: Run bats suites
        run: bun run test:bats

  bun:
    name: bun tests
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Discovers every tests/<suite>/ except smoke, so a new plugin needs no
      # workflow change.
      - name: Run plugin tests
        run: bun run test:plugins

  smoke:
    name: plugin load
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 不锁版本：冒烟始终针对 npm 上的最新版 CLI。缓存这 500 MB
      # 二进制的恢复耗时反而比现装更久，所以不缓存。
      - name: Install OpenCode CLI
        run: bun install -g --trust @opencode/cli

      - name: Put OpenCode on PATH
        run: echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Verify plugin loading
        run: bun run test:smoke
