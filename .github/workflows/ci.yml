name: CI

on:
  push:
    branches: [main, develop]
  # 手动补跑用；合并没有接在这里，merge-branch 自己会跑完整测试
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 先预热共享的 bun 下载缓存，下面的并行作业直接复用
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

  bats:
    name: bats
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          parallel: "true"

      - name: Run bats suites
        run: bun run test:bats

  bun:
    name: bun tests
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # 自动发现 tests/ 下除 smoke 外的所有套件，新增插件不用改 workflow
      - name: Run plugin tests
        run: bun run test:plugins

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # 本地用 `bun run typecheck` 快检；CI 用 tsc 作为准绳，与 OpenCode 官方一致
      - name: Typecheck
        run: bun run typecheck:tsc

  smoke:
    name: plugin load
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # 不锁版本：冒烟始终针对 npm 上的最新版 CLI
      - name: Install OpenCode CLI
        run: bun install -g --trust @opencode/cli

      - name: Add OpenCode to PATH
        run: echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Verify plugin loading
        run: bun run test:smoke
